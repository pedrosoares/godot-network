name: Build Rust

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            bin_path: target/release/libgodot_network.so
            out_name: libgodot_whisper.so
          - os: windows-latest
            bin_path: target/release/godot_network.dll
            out_name: godot_whisper.dll
          - os: macos-latest
            bin_path: target/release/libgodot_network.dylib
            out_name: libgodot_whisper.dylib

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Build Windows
        shell: bash
        run: |
          cargo build --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out_name }}
          path: ${{ matrix.bin_path }}
          if-no-files-found: error
